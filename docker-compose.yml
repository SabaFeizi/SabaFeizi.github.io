services:
  # Live-reloading development server: http://localhost:8080 (admin: /admin)
  dev:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ELEVENTY_ENV: development
      ELEVENTY_POLLING: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Production build served by nginx with production-like headers: http://localhost:8081
  preview:
    build:
      context: .
      target: preview
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  node_modules:
