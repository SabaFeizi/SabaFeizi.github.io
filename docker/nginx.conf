# Local production-like preview. GitHub Pages cannot send these headers; serving them here
# proves the site keeps working under the strictest header set (e.g. behind a future CDN).
server {
  listen 8081;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(?:css|js|woff2|png|jpe?g|webp|avif|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
  }
}
