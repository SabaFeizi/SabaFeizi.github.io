# Local production preview that behaves like GitHub Pages: it serves the built site WITHOUT
# custom security headers, because GitHub Pages cannot send them. The site's own protections
# (the <meta> Content-Security-Policy in every page and the frame guards) are therefore tested
# exactly as they will work in production.
server {
  listen 8081;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  autoindex off;

  # GitHub Pages does send this one.
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(?:css|js|woff2|png|jpe?g|webp|avif|ico)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=600" always;
  }
}
