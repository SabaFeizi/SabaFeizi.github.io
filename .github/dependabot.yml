# Keeps dependencies and pinned actions up to date. New releases must be at least
# 14 days old before Dependabot proposes them (supply-chain cool-down).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # Must be upgraded together with the Playwright Docker image (see Dockerfile): done by hand.
      - dependency-name: "@playwright/test"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      # Stay on the current Node.js long-term-support line; major upgrades are done by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Must match the @playwright/test version in package.json: upgraded by hand.
      - dependency-name: "mcr.microsoft.com/playwright"
